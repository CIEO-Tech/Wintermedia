

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#08090d">
<title>Grade Video Gallery</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

:root {
  --accent: #a78bfa;
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #08090d;
  color: #fff;
  font-family: -apple-system, BlinkMacSystemFont,
    "Segoe UI", sans-serif;
}

.stage {
  position: fixed;
  inset: 0;
  background: #08090d;
  display: flex;
  justify-content: center;
  align-items: center;
}

video {
  width: 100%;
  height: 100%;
  object-fit: contain;
  object-position: center;
}

.overlay {
  position: fixed;
  inset: 0;
  pointer-events: none;
  background: linear-gradient(
    to bottom,
    rgba(0,0,0,.65),
    transparent 30%,
    transparent 70%,
    rgba(0,0,0,.35)
  );
  z-index: 2;
}

/* Header */
.top-bar {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 5;
  padding: 20px 5vw;
  display: flex;
  justify-content: space-between;
  align-items: center;
  transition: opacity .4s, transform .4s;
}

.brand {
  display: flex;
  align-items: center;
  gap: 12px;
}

.brand-icon {
  width: 42px;
  height: 42px;
  border-radius: 14px;
  background: linear-gradient(135deg,#a78bfa,#6366f1);
  display: grid;
  place-items: center;
  font-size: 20px;
  box-shadow: 0 5px 25px rgba(139,92,246,.35);
}

.brand-name {
  font-size: 17px;
  font-weight: 750;
  letter-spacing: 1.5px;
}

.brand-sub {
  font-size: 10px;
  color: rgba(255,255,255,.55);
  letter-spacing: 2px;
  margin-top: 3px;
}

.status {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 11px;
  color: rgba(255,255,255,.75);
  letter-spacing: 1.5px;
  background: rgba(255,255,255,.08);
  border: 1px solid rgba(255,255,255,.12);
  padding: 10px 15px;
  border-radius: 30px;
  backdrop-filter: blur(15px);
}

.status-dot {
  width: 7px;
  height: 7px;
  background: #4ade80;
  border-radius: 50%;
  box-shadow: 0 0 10px #4ade80;
}

/* Grade information */
.grade-info {
  position: fixed;
  left: 5vw;
  bottom: 35px;
  z-index: 4;
  pointer-events: none;
  transition: opacity .4s, transform .4s;
}

.grade-label {
  font-size: 11px;
  letter-spacing: 4px;
  color: var(--accent);
  font-weight: 700;
  margin-bottom: 8px;
}

.grade-title {
  font-size: clamp(35px, 7vw, 68px);
  font-weight: 850;
  letter-spacing: -2px;
  text-shadow: 0 5px 30px rgba(0,0,0,.4);
}

.grade-description {
  margin-top: 8px;
  font-size: 13px;
  color: rgba(255,255,255,.65);
  letter-spacing: 1px;
}

/* Student name */
.student-name {
  margin-top: 10px;
  font-size: 17px;
  font-weight: 650;
  color: #fff;
  letter-spacing: 1px;
  text-shadow: 0 3px 15px rgba(0,0,0,.6);
}

/* Grade controls */
.controls {
  position: fixed;
  top: 90px;
  bottom: auto;
  left: 50%;
  transform: translateX(-50%);
  z-index: 10;
  width: min(94%, 760px);
  padding: 17px;
  border-radius: 24px;
  background: rgba(20,20,29,.78);
  border: 1px solid rgba(255,255,255,.12);
  backdrop-filter: blur(25px);
  -webkit-backdrop-filter: blur(25px);
  box-shadow: 0 15px 60px rgba(0,0,0,.4);
  transition: opacity .4s, transform .4s;
}

.control-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 0 5px 14px;
}

.control-heading {
  font-size: 11px;
  letter-spacing: 2px;
  font-weight: 750;
  color: rgba(255,255,255,.85);
}

.video-count {
  font-size: 11px;
  color: rgba(255,255,255,.55);
}

.grade-buttons {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 9px;
}

.grade-btn {
  border: 1px solid rgba(255,255,255,.09);
  background: rgba(255,255,255,.045);
  color: rgba(255,255,255,.75);
  border-radius: 15px;
  padding: 15px 4px;
  cursor: pointer;
  transition: all .25s ease;
  font-size: 13px;
  font-weight: 700;
}

.grade-btn span {
  display: block;
  font-size: 9px;
  font-weight: 500;
  opacity: .55;
  margin-top: 5px;
  letter-spacing: 1px;
}

.grade-btn:hover {
  background: rgba(167,139,250,.16);
  border-color: rgba(167,139,250,.5);
  color: white;
  transform: translateY(-2px);
}

.grade-btn.active {
  color: #fff;
  background: linear-gradient(135deg,#8b5cf6,#6366f1);
  border-color: transparent;
  box-shadow: 0 5px 22px rgba(124,58,237,.35);
  transform: translateY(-2px);
}

/* Hide animation */
.controls.hidden {
  opacity: 0;
  transform: translate(-50%, -30px);
  pointer-events: none;
}

.top-bar.hidden {
  opacity: 0;
  transform: translateY(-20px);
  pointer-events: none;
}

.grade-info.hidden {
  opacity: 0;
  transform: translateY(15px);
}

/* Mobile */
@media(max-width: 500px) {
  .top-bar {
    padding: 15px 5vw;
  }

  .brand-icon {
    width: 36px;
    height: 36px;
    border-radius: 11px;
  }

  .brand-name {
    font-size: 14px;
  }

  .status {
    font-size: 9px;
    padding: 8px 11px;
  }

  .controls {
    top: 75px;
    bottom: auto;
    padding: 12px;
    border-radius: 19px;
  }

  .grade-buttons {
    gap: 5px;
  }

  .grade-btn {
    padding: 13px 2px;
    font-size: 11px;
    border-radius: 11px;
  }

  .grade-btn span {
    font-size: 8px;
  }

  .grade-info {
    bottom: 25px;
  }

  .grade-title {
    font-size: 42px;
  }

  .student-name {
    font-size: 15px;
  }
}

@media(max-height: 500px) {
  .controls {
    top: 65px;
    padding: 8px;
  }

  .grade-btn {
    padding: 9px 3px;
  }

  .control-header {
    padding-bottom: 7px;
  }
}
</style>
</head>

<body>

<div class="stage">
  <video id="bg-video" autoplay muted playsinline></video>
</div>

<div class="overlay"></div>

<!-- Header -->
<div class="top-bar" id="topBar">
  <div class="brand">
    <div class="brand-icon">▶</div>
    <div>
      <div class="brand-name">VIDEO GALLERY</div>
      <div class="brand-sub">STUDENT SHOWCASE</div>
    </div>
  </div>

  <div class="status">
    <div class="status-dot"></div>
    NOW PLAYING
  </div>
</div>

<!-- Grade information -->
<div class="grade-info" id="gradeInfo">
  <div class="grade-label">STUDENT SHOWCASE</div>
  <div class="grade-title" id="gradeTitle">GRADE 6</div>
  <div class="grade-description" id="gradeDescription">
    A collection of student videos
  </div>
  <div class="student-name" id="studentName">
    Created by Ares
  </div>
</div>

<!-- Grade selection -->
<div class="controls" id="controls">
  <div class="control-header">
    <div class="control-heading">SELECT YOUR GRADE</div>
    <div class="video-count" id="videoCount">10 VIDEOS</div>
  </div>

  <div class="grade-buttons">

    <button class="grade-btn"
      onclick="switchPlaylist('grade5',this)">
      GRADE 5
      <span>LEVEL 01</span>
    </button>

    <button class="grade-btn active"
      onclick="switchPlaylist('grade6',this)">
      GRADE 6
      <span>LEVEL 02</span>
    </button>

    <button class="grade-btn"
      onclick="switchPlaylist('grade7',this)">
      GRADE 7
      <span>LEVEL 03</span>
    </button>

    <button class="grade-btn"
      onclick="switchPlaylist('grade8',this)">
      GRADE 8
      <span>LEVEL 04</span>
    </button>

    <button class="grade-btn"
      onclick="switchPlaylist('grade9',this)">
      GRADE 9
      <span>LEVEL 05</span>
    </button>

  </div>
</div>

<script>

const playlists = {

  grade5: [
    { video: "Grade 5/cathy.mov", name: "Cathy" },
    { video: "Grade 5/ivan.mov", name: "Ivan" },
    { video: "Grade 5/levon.mov", name: "Levon" },
    { video: "Grade 5/milly.mov", name: "Milly" },
    { video: "Grade 5/nare.mov", name: "Nare" },
    { video: "Grade 5/timmy.mov", name: "Timmy" },
    { video: "Grade 5/winnie.mov", name: "Winnie" }
  ],

  grade6: [
    { video: "Grade 6/ares.mov", name: "Ares" },
    { video: "Grade 6/champ.mov", name: "Champ" },
    { video: "Grade 6/devin.mov", name: "Devin" },
    { video: "Grade 6/jack.mov", name: "Jack" },
    { video: "Grade 6/kathryn.mov", name: "Kathryn" },
    { video: "Grade 6/marcia.mov", name: "Marcia" },
    { video: "Grade 6/max.mov", name: "Max" },
    { video: "Grade 6/mekas.mov", name: "Mekas" },
    { video: "Grade 6/nastia.mov", name: "Nastia" },
    { video: "Grade 6/yiteng.mov", name: "Yiteng" }
  ],

  grade7: [
    { video: "Grade 7/video1.mov", name: "Video 1" },
    { video: "Grade 7/video2.mov", name: "Video 2" }
  ],

  grade8: [
    { video: "Grade 8/video1.mov", name: "Video 1" },
    { video: "Grade 8/video2.mov", name: "Video 2" }
  ],

  grade9: [
    { video: "Grade 9/video1.mov", name: "Video 1" },
    { video: "Grade 9/video2.mov", name: "Video 2" }
  ]

};

let currentGrade = "grade6";
let currentIndex = 0;
let hideTimeout;

const videoPlayer = document.getElementById("bg-video");
const controls = document.getElementById("controls");
const topBar = document.getElementById("topBar");
const gradeInfo = document.getElementById("gradeInfo");
const gradeTitle = document.getElementById("gradeTitle");
const gradeDescription = document.getElementById("gradeDescription");
const studentName = document.getElementById("studentName");
const videoCount = document.getElementById("videoCount");

/* Play video */
function playNextVideo() {

  const activeList = playlists[currentGrade];

  if (!activeList || activeList.length === 0) return;

  const currentVideo = activeList[currentIndex];

  videoPlayer.src = encodeURI(currentVideo.video);
  videoPlayer.load();

  videoPlayer.play().catch(error => {
    console.warn("Playback requires user interaction:", error);
  });

  // Display student name
  studentName.textContent = "Created by " + currentVideo.name;

  currentIndex = (currentIndex + 1) % activeList.length;
}

/* Switch grade */
function switchPlaylist(gradeKey, clickedButton) {

  currentGrade = gradeKey;
  currentIndex = 0;

  document.querySelectorAll(".grade-btn").forEach(btn => {
    btn.classList.remove("active");
  });

  clickedButton.classList.add("active");

  gradeTitle.textContent = gradeKey.toUpperCase();

  videoCount.textContent =
    playlists[gradeKey].length + " VIDEOS";

  playNextVideo();
  showControls();
}

/* Show controls */
function showControls() {

  controls.classList.remove("hidden");
  topBar.classList.remove("hidden");
  gradeInfo.classList.remove("hidden");

  clearTimeout(hideTimeout);

}

/* Automatically play next video */
videoPlayer.addEventListener("ended", playNextVideo);

/* Show interface on interaction */
document.addEventListener("mousemove", showControls);
document.addEventListener("touchstart", showControls);
document.addEventListener("click", showControls);

/* Keyboard controls */
document.addEventListener("keydown", e => {

  if (e.key === "ArrowRight") {
    playNextVideo();
  }

  if (e.key === " ") {

    e.preventDefault();

    if (videoPlayer.paused) {
      videoPlayer.play().catch(() => {});
    } else {
      videoPlayer.pause();
    }

  }

  showControls();

});

/* Initial setup */
videoCount.textContent = playlists.grade6.length + " VIDEOS";

playNextVideo();
showControls();

</script>

</body>
</html>
